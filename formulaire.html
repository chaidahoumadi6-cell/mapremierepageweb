<!--je créer un formulair d'inscription-->
<!DOCTYPE html>


<html>
    

    <head>

        <!--configuration de paramétre-->
        <meta charset="utf-8">
        <title>formulaire d'inscription</title>

        <!-- insére un lien-->
        <link rel="stylesheet" href="formulaire.css">

    </head>


    <body>
        <!-- je code la structure du formulaire dinscription-->
        <form> <!---début du formulaire-->
            <div>

                <!--label associé au champs de texte avec l' indentifier un nom-->
                <label for="prenom">prénom(s):</label>
                <input type="text" name="prenom" id="prénom">

                <label for="nom"> Nom:</label>
                <input type="text" name="nom" id="nom">
                
            </div>
                <br><br>
            <div>  
                <!--date= permet à l'utilisateur de sélectionnner une date à l'aide d'un calendrier--> 
                <label for="date">date de naissance: </label>
         
                <input type="date" name="dateNaissance" id="dateNaissance" >
                <!--crée un champ de texte pour la saisie de texte simple comme un non une adresse, etc-->
                <label for="village">village:</label>
                <input type="text" name="village" id="village">
               <br><br>
            </div>
            
            <div>
                 <!--radio= seul un bouton radio d'un meme groupe peut etre sélectionne à la fois-->
                <label for="genre">Genre:</label>
                <input type="radio" name="femme" id="femme">
                <label for="femme">F</label>
                <input type="radio" name="homme"id="homme">
                <label for="homme">M</label>
                
                

            </div>
            <br><br>

            <div>
                
                <label for="disciplines">Disciplines :</label>
                <input type="checkbox"name="disciplines" id="disciplines">
                <label for="mathematiques">Mathématiques:</label>
                <input type="checkbox"name="mathematiques" id="mathematiques">
                <label for="histoiregéographique">Histoire géographie</label>
                <input type="checkbox"name="histoiregéographique" id="histoiregéographique">
                <label for="eps">EPS</label>
                

            </div>   
                <br><br>
            <div>
                 <label for="email">Email:</label>
                <input type="email" id="email" name="email">

            </div>
                <br><br>
                <input type="submit">
    
        </form> <!--fin du formulaire-->

         

         


    </body>

</html>
